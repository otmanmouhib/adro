name: adro-hub

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped

  commander:
    image: adro/commander:0.1.0
    restart: unless-stopped

  dashboard:
    image: adro/dashboard:0.1.0
    restart: unless-stopped

  discovery:
    image: adro/discovery:0.1.0
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped

networks:
  default:
    name: adro-net
