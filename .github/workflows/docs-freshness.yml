name: Docs Freshness
on:
  pull_request:
    branches: [master, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn if source changed without docs
        run: |
          set -e
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || true)
          echo "Changed files:"
          echo "$CHANGED"
          warn=0
          for board in switch-station-v0 dosing-station-v0 onesense-v0 sixsense-v0; do
            if echo "$CHANGED" | grep -q "^hardware/$board/"; then
              if ! echo "$CHANGED" | grep -q "^docs/01-hardware/$board.md"; then
                echo "::warning::hardware/$board changed without docs/01-hardware/$board.md"
                warn=1
              fi
            fi
            if echo "$CHANGED" | grep -q "^firmware/$board/"; then
              if ! echo "$CHANGED" | grep -q "^docs/02-firmware/$board.md"; then
                echo "::warning::firmware/$board changed without docs/02-firmware/$board.md"
                warn=1
              fi
            fi
          done
          [ $warn -eq 0 ] && echo "Docs freshness OK" || true
