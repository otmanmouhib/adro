name: adro-cloud

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: adro-cloud-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /etc/mosquitto/passwd:/mosquitto/config/passwd
      - /etc/mosquitto/acl:/mosquitto/config/acl
      - /opt/adro-data/mosquitto-cloud:/mosquitto/data
    networks:
      - adro-cloud-net

networks:
  default:
    name: adro-cloud-net
