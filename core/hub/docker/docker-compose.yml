name: adro-hub

services:
  mosquitto:
    build: ./mosquitto
    image: adrodocker/mosquitto-hub:latest
    container_name: adro-core-hub-mosquitto
    restart: unless-stopped
    labels:
      - "freshdock.enable=true"
      - "freshdock.mode=live"
    env_file:
      - path: /opt/adro-config/site.env
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - /opt/adro-data/mosquitto:/mosquitto/data
      - /opt/adro-data/mosquitto-log:/mosquitto/log
      - /sys/class/net:/host-sys/class/net:ro
    networks:
      - adro-net


  autossh:
    image: oaklight/autossh-tunnel:latest
    container_name: adro-core-hub-autossh
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ:   ${TZ:-UTC}
    volumes:
      - ./autossh/config:/etc/autossh/config
      - ./autossh/ssh:/home/myuser/.ssh:ro
    networks:
      - adro-net


  freshdock:
    image: ghcr.io/turbootzz/freshdock:latest
    container_name: adro-core-hub-freshdock
    restart: unless-stopped
    command: ["run"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FRESHDOCK_INTERVAL=86400
      - TZ=Africa/Casablanca
    networks:
      - adro-net


  ota-server:
    image: nginx:alpine
    container_name: adro-core-hub-ota
    restart: unless-stopped
    cap_add:
      - CAP_NET_BIND_SERVICE
    ports:
      - "8000:80"
    volumes:
      - /home/kenaro/adro/core/hub/ota:/usr/share/nginx/html:ro
      - /home/kenaro/adro/core/hub/docker/ota/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - adro-net


  ota-filebrowser:
    image: hurlenko/filebrowser:latest
    container_name: adro-core-hub-ota-filebrowser
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8090:8080"
    volumes:
      - /home/kenaro/adro/core/hub/ota:/data
      - /home/kenaro/adro/core/hub/docker/ota-fb-config:/config
    environment:
      - FB_BASEURL=/
      - FB_PORT=8080
    networks:
      - adro-net


  portainer:
    image: portainer/portainer-ce:latest
    container_name: adro-core-hub-portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/adro-data/portainer:/data
    networks:
      - adro-net


  portainer-agent:
    image: portainer/agent:2.45.2
    container_name: adro-core-hub-portainer-agent
    restart: unless-stopped
    ports:
      - "9002:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - adro-net


  dashboard:
    build: ./dashboard
    image: adrodocker/dashboard-hub:latest
    container_name: adro-core-hub-dashboard
    restart: unless-stopped
    labels:
      - "freshdock.enable=true"
      - "freshdock.mode=live"

    environment:
      NEXT_PUBLIC_ADRO_BROKER_URL: "ws://adro.local:9001"
      NEXT_PUBLIC_ADRO_TITLE: "Adro Hub"
    ports:
      - "8081:3000"
    depends_on:
      - mosquitto
    networks:
      - adro-net

  # Lightweight static (Preact + nginx) alternative to the Next.js dashboard.
  # Runs on port 80; the original dashboard remains available on port 8081.
  potman-dashboard:
    build: ./potman-dashboard
    image: adrodocker/potman-dashboard-hub:latest
    container_name: adro-core-hub-potman-dashboard
    restart: unless-stopped
    environment:
      ADRO_TITLE: "Adro Hub"
      TZ: ${TZ:-Africa/Casablanca}
      # Leave empty to use ws://<browser host>:9001
      ADRO_BROKER_URL: ""
    ports:
      - "80:80"
    volumes:
      - potman-systems-data:/data
    depends_on:
      - mosquitto
    networks:
      - adro-net

networks:
  adro-net:
    name: adro-net
    driver: bridge

volumes:
  potman-systems-data:
