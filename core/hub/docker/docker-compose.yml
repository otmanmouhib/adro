name: adro-hub

services:
  mosquitto:
    build: ./mosquitto
    image: adro/mosquitto-hub:0.1.0
    container_name: adro-mosquitto
    restart: unless-stopped
    env_file:
      - /opt/adro-config/site.env
    ports:
      - "1883:1883"     # MQTT (LAN)
      - "9001:9001"     # MQTT over WebSocket
    volumes:
      - /opt/adro-data/mosquitto:/mosquitto/data
      - /opt/adro-data/mosquitto-log:/mosquitto/log
    networks:
      - adro-net

networks:
  default:
    name: adro-net
