name: adro-hub

services:
  mosquitto:
    build: ./mosquitto
    image: adro/mosquitto-hub:0.1.0
    container_name: adro-mosquitto
    restart: unless-stopped
    env_file:
      - /opt/adro-config/site.env
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - /opt/adro-data/mosquitto:/mosquitto/data
      - /opt/adro-data/mosquitto-log:/mosquitto/log
      - /sys:/host-sys:ro

    networks:
      - adro-net

networks:
  adro-net:
    name: adro-net
    driver: bridge
