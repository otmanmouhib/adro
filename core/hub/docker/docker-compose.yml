name: adro-hub

services:
  mosquitto:
    build: ./mosquitto
    image: adro/mosquitto-hub:0.1.0
    container_name: adro-mosquitto
    restart: unless-stopped
    env_file:
      - /opt/adro-config/site.env
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - /opt/adro-data/mosquitto:/mosquitto/data
      - /opt/adro-data/mosquitto-log:/mosquitto/log
      - /sys/class/net:/host-sys/class/net:ro
    networks:
      - adro-net


  watchtower:
    image: containrrr/watchtower:latest
    container_name: adro-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_REVIVE_STOPPED=false
      - TZ=Africa/Casablanca
    networks:
      - adro-net


  # ── OTA: firmware HTTP server (ESP-facing, port 8000) ──
  ota-server:
    image: nginx:alpine
    container_name: ota-server
    restart: unless-stopped
    cap_add:
      - CAP_NET_BIND_SERVICE
    ports:
      - "8000:80"
    volumes:
      # Same host directory FileBrowser writes to
      - /home/kenaro/adro/core/hub/ota:/usr/share/nginx/html:ro
      # Versioned nginx config (lives in the repo)
      - /home/kenaro/adro/core/hub/ota/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - adro-net


  # ── OTA: FileBrowser UI (management, port 8090) ──
  ota-filebrowser:
    image: hurlenko/filebrowser:latest
    container_name: ota-filebrowser
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8090:8080"
    volumes:
      # Same host directory nginx serves
      - /home/kenaro/adro/core/hub/ota:/data
      # FileBrowser's own DB + settings
      - /home/kenaro/adro/core/hub/docker/ota-fb-config:/config
    environment:
      - FB_BASEURL=/
      - FB_PORT=8080
    networks:
      - adro-net


  portainer:
    image: portainer/portainer-ce:latest
    container_name: adro-portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/adro-data/portainer:/data
    networks:
      - adro-net

  portainer-agent:
    image: portainer/agent:2.45.2
    container_name: adro-portainer-agent
    restart: unless-stopped
    ports:
      - "9002:9001"     # the agent tunnel port
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - adro-net


  dashboard:
    build: ./dashboard
    image: adro/dashboard-hub:0.1.0
    container_name: adro-dashboard
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_ADRO_BROKER_URL: "ws://adro.local:9001"
      NEXT_PUBLIC_ADRO_TITLE: "Adro Hub"
    ports:
      - "80:3000"
    depends_on:
      - mosquitto
    networks:
      - adro-net

networks:
  adro-net:
    name: adro-net
    driver: bridge